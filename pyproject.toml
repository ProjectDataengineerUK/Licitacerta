[tool.poetry]
name = "licitacerta"
version = "0.1.0"
description = "Sistema multi-agente de IA para licitações públicas brasileiras"
authors = ["Jonatas Lima <jonataslimac@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.3"
langchain-anthropic = "^0.3"
langchain-google-vertexai = "^2.0"
anthropic = "^0.45"
pydantic = "^2.0"
pydantic-settings = "^2.0"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
python-multipart = "^0.0.12"
sqlalchemy = "^2.0"
alembic = "^1.14"
asyncpg = "^0.30"
psycopg2-binary = "^2.9"
redis = "^5.2"
httpx = "^0.28"
pypdf2 = "^3.0"
pytesseract = "^0.3"
Pillow = "^11.0"
langfuse = "^3.0"
python-dotenv = "^1.0"
# GCP SDKs — optional, guarded by lazy imports; install as needed
google-cloud-storage = { version = "^2.18", optional = true }
google-cloud-documentai = { version = "^2.35", optional = true }
google-cloud-aiplatform = { version = "^1.70", optional = true }
google-cloud-bigquery = { version = "^3.27", optional = true }
google-cloud-tasks = { version = "^2.17", optional = true }
google-cloud-pubsub = { version = "^2.27", optional = true }
google-cloud-secret-manager = { version = "^2.22", optional = true }
google-cloud-monitoring = { version = "^2.23", optional = true }
cloud-sql-python-connector = { version = "^1.12", extras = ["asyncpg"], optional = true }
firebase-admin = { version = "^6.6", optional = true }
opentelemetry-sdk = { version = ">=1.28", optional = true }
opentelemetry-exporter-gcp-trace = { version = ">=1.8", optional = true }
opentelemetry-instrumentation-fastapi = { version = ">=0.44b0", optional = true }

[tool.poetry.extras]
gcp = [
  "google-cloud-storage",
  "google-cloud-documentai",
  "google-cloud-aiplatform",
  "google-cloud-bigquery",
  "google-cloud-tasks",
  "google-cloud-pubsub",
  "google-cloud-secret-manager",
  "google-cloud-monitoring",
  "cloud-sql-python-connector",
  "firebase-admin",
  "opentelemetry-sdk",
  "opentelemetry-exporter-gcp-trace",
  "opentelemetry-instrumentation-fastapi",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
respx = "^0.21"
pytest-mock = "^3.14"
ruff = "^0.8"
mypy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "google.cloud.*",
  "google.api_core.*",
  "google.protobuf.*",
  "firebase_admin.*",
  "opentelemetry.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.gcp.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require real LLM/API calls (deselect with -k 'not integration')",
]
